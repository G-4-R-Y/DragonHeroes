; Dragon Heroes: Rebirth — UE 5.4 project settings. SOTA feature set from the
; plan (Nanite + Lumen + VSM). No default map: RebirthGameMode builds the
; valley procedurally at BeginPlay (Source/Rebirth/Valley), so an EMPTY level
; saved as /Game/Maps/Valley is all the editor step needs (INSTALL.md §3).

[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/Game/Maps/Valley.Valley
